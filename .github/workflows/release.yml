name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build AppImage and Tarball
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build & Qt6 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            qml6-module-qtquick-templates \
            libqt6opengl6-dev \
            qt6-wayland \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            desktop-file-utils \
            file \
            wget \
            libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Build Hisaab
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel $(nproc)
          ctest --test-dir build --output-on-failure

      - name: Install to AppDir
        run: |
          DESTDIR=${{ github.workspace }}/AppDir cmake --install build
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp assets/hisaab.png AppDir/usr/share/icons/hicolor/512x512/apps/hisaab.png
          cp assets/hisaab.png AppDir/usr/share/icons/hicolor/256x256/apps/hisaab.png
          cp assets/hisaab.png AppDir/hisaab.png

      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=$(which qmake6 2>/dev/null || which /usr/lib/qt6/bin/qmake 2>/dev/null || which qmake 2>/dev/null)
          export QML_SOURCES_PATHS=${{ github.workspace }}/qml

          echo "Using QMAKE: $QMAKE"

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

          mv Hisaab*.AppImage Hisaab-x86_64.AppImage || mv *.AppImage Hisaab-x86_64.AppImage
          chmod +x Hisaab-x86_64.AppImage

      - name: Package Release Tarball
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          if [ "$VERSION" = "main" ]; then VERSION="v1.0.0"; fi
          FOLDER="hisaab-${VERSION}-linux-x86_64"
          mkdir -p "$FOLDER"
          cp build/hisaab "$FOLDER/"
          cp hisaab.desktop "$FOLDER/"
          cp assets/hisaab.png "$FOLDER/"
          cat << 'EOF' | sed 's/^[ \t]*//' > "$FOLDER/install.sh"
          #!/bin/bash
          set -e
          INSTALL_PREFIX="${HOME}/.local"
          BIN_DIR="${INSTALL_PREFIX}/bin"
          APP_DIR="${INSTALL_PREFIX}/share/applications"
          ICON_DIR="${INSTALL_PREFIX}/share/icons/hicolor/512x512/apps"
          PIX_DIR="${INSTALL_PREFIX}/share/pixmaps"

          mkdir -p "$BIN_DIR" "$APP_DIR" "$ICON_DIR" "$PIX_DIR"
          cp hisaab "$BIN_DIR/"
          chmod +x "$BIN_DIR/hisaab"
          cp hisaab.desktop "$APP_DIR/"
          cp hisaab.png "$ICON_DIR/"
          cp hisaab.png "$PIX_DIR/"

          command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database "$APP_DIR" 2>/dev/null || true
          command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache "${INSTALL_PREFIX}/share/icons/hicolor" 2>/dev/null || true

          echo "✓ Hisaab installed successfully to ${BIN_DIR}/hisaab"
          EOF
          chmod +x "$FOLDER/install.sh"
          tar -czvf "hisaab-${VERSION}-linux-x86_64.tar.gz" "$FOLDER"

      - name: Generate Checksums
        run: |
          sha256sum Hisaab-x86_64.AppImage hisaab-*.tar.gz > SHA256SUMS.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.ref_name == 'main' || github.ref_name == '') && 'v1.0.0' || github.ref_name }}
          files: |
            Hisaab-x86_64.AppImage
            hisaab-*.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
# End of AI-generated section.
